# Render Blueprint specification for Akshaya Patra Welfare
# Deploys the API, public site, and independent seller portal as separate services.

services:
  # ==========================================
  # 1. BACKEND API SERVICE (Node / Express)
  # ==========================================
  - type: web
    name: akshaya-patra-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: akshaya_patra
      - key: MONGODB_BACKUP_URI
        sync: false
      - key: MONGODB_BACKUP_DB
        value: akshaya_patra_backup
      - key: OTP_HASH_SECRET
        sync: false
      - key: OTP_DELIVERY_MODE
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SELLER_ADMIN_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_LOGIN_LOCKOUT_MINUTES
        value: 15
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_RESET_CODE
        sync: false
      - key: ADMIN_OTP_MODE
        sync: false
      - key: ADMIN_SMS_ACCOUNT_SID
        sync: false
      - key: ADMIN_SMS_AUTH_TOKEN
        sync: false
      - key: ADMIN_SMS_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    healthCheckPath: /api/health

  # ==========================================
  # 2. FRONTEND STATIC WEB APP (Vite / React)
  # ==========================================
  - type: web
    name: akshaya-patra-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /godadmin
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://testone-viby.onrender.com
      - key: VITE_ORG_LEGAL_NAME
        value: AKSHAYAPATRA WELFARE FOUNDATION
      - key: VITE_ORG_SHORT_NAME
        value: Akshaya Patra Welfare
      - key: VITE_ORG_TAGLINE
        value: Care Beyond the Last Mile
      - key: VITE_ORG_CIN
        sync: false
      - key: VITE_ORG_PAN
        value: ABGCA9446E
      - key: VITE_ORG_TAN
        value: HYDA43550D
      - key: VITE_ORG_DATE_OF_INCORPORATION
        value: 2026-10-08
      - key: VITE_ORG_LEGAL_STRUCTURE
        value: Section 8 Company
      - key: VITE_ORG_OPERATION_SCOPE
        value: India
      - key: VITE_ORG_SECTION8_REGISTRATION
        sync: false
      - key: VITE_ORG_12A_URN
        sync: false
      - key: VITE_ORG_80G_URN
        sync: false
      - key: VITE_ORG_DARPAN_ID
        sync: false
      - key: VITE_ORG_CSR1_REG_NO
        sync: false
      - key: VITE_ORG_GSTIN
        sync: false
      - key: VITE_ORG_80G_DEDUCTION_PERCENT
        sync: false
      - key: VITE_ORG_AUTHORIZED_SIGNATORY
        sync: false
      - key: VITE_ORG_BANK_ACCOUNT_NAME
        sync: false
      - key: VITE_ORG_BANK_NAME
        sync: false
      - key: VITE_ORG_BANK_ACCOUNT_NUMBER
        sync: false
      - key: VITE_ORG_BANK_IFSC
        sync: false
      - key: VITE_ORG_BANK_BRANCH
        sync: false
      - key: VITE_ORG_ESCROW_ACCOUNT_LABEL
        sync: false
      - key: VITE_ORG_AUDIT_DESCRIPTION
        sync: false
      - key: VITE_ORG_80G_ORDER_NUMBER
        sync: false
      - key: VITE_ORG_PHONE
        value: 7799499778
      - key: VITE_ORG_ADDRESS_LINE1
        value: Survey No. 75, 76
      - key: VITE_ORG_LOCALITY
        value: Raidurga
      - key: VITE_ORG_AREA
        value: Shaikpet
      - key: VITE_ORG_CITY
        value: Hyderabad
      - key: VITE_ORG_REGION
        value: Cyberabad
      - key: VITE_ORG_STATE
        value: Telangana
      - key: VITE_ORG_PINCODE
        value: 500081
      - key: VITE_ORG_COUNTRY
        value: India
      - key: VITE_ORG_NON_PROFIT
        value: "true"
      - key: VITE_ORG_PAN_VERIFIED
        value: "true"
      - key: VITE_ORG_TAN_VERIFIED
        value: "true"
      - key: VITE_ORG_GOVT_COMPLIANCE_NOTE
        value: Registered entity with PAN and TAN issued by Income Tax Department
      - key: VITE_WEBSITE_TITLE
        value: Akshaya Patra Welfare Foundation
      - key: VITE_WEBSITE_SUBTITLE
        value: Care Beyond the Last Mile
      - key: VITE_DONATION_RECEIPTS_ENABLED
        value: "true"

  # ==========================================
  # 3. PRIVATE SELLER WORKSPACE (Vite / React)
  # ==========================================
  - type: web
    name: akshaya-patra-seller-portal
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build:seller-portal
    staticPublishPath: ./seller-portal/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: akshaya-patra-backend
          property: host
